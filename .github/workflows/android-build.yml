name: VEYRA Android build

on:
  workflow_dispatch:

jobs:
  android-build:
    name: Build VEYRA APK
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity license secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before starting an Android build."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.32f1
          targetPlatform: Android
          buildName: VEYRA
          buildsPath: build
          androidAppBundle: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEYRA-Android-APK
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14
