name: Lipa Arena - Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -maxdepth 1 -type f -name 'Godot_*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo mv "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Runtime startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path . --quit-after 3 2>&1 | tee runtime-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error" runtime-smoke.log; then
            echo "Godot reported a startup script error."
            exit 1
          fi

      - name: Prepare persistent Android signing key
        env:
          LIPA_ANDROID_KEYSTORE_BASE64: ${{ secrets.LIPA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$LIPA_ANDROID_KEYSTORE_BASE64" || { echo "Missing GitHub Actions secret: LIPA_ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$LIPA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/lipa-release.keystore"
          test -s "${{ runner.temp }}/lipa-release.keystore"

      - name: Export signed Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/lipa-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.LIPA_ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.LIPA_ANDROID_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER_PASSWORD: ${{ secrets.LIPA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" || { echo "Missing GitHub Actions secret: LIPA_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" || { echo "Missing GitHub Actions secret: LIPA_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER_PASSWORD" || { echo "Missing GitHub Actions secret: LIPA_ANDROID_KEY_PASSWORD"; exit 1; }
          mkdir -p build
          godot --headless --path . --export-release "Android" build/LipaArena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lipa-Arena-Android-APK
          path: build/LipaArena.apk
          if-no-files-found: error
          retention-days: 14
