name: Read latest Godot screenshots
on:
  push:
    paths:
      - '.github/workflows/read-screenshots.yml'
  workflow_dispatch:
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Read latest screenshots
        run: |
          for f in $(find screenshots -type f \( -iname '*.jpg' -o -iname '*.png' \) | sort | tail -4); do
            echo "===== $f ====="
            tesseract "$f" stdout 2>/dev/null
          done
